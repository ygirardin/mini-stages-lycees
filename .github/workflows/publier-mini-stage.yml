name: Publier un mini-stage validé

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: publication-mini-stages
  cancel-in-progress: false

jobs:
  publier:
    if: >-
      ${{ !github.event.issue.pull_request &&
          github.event.comment.body == '/publier-mini-stage' &&
          github.event.comment.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le catalogue
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Contrôler les informations et préparer la fiche
        run: python3 .github/scripts/publier_proposition.py
      - name: Publier la fiche validée
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mini-stages.json
          if ! git diff --cached --quiet; then
            git commit -m "Publier le mini-stage proposé dans l'issue #$ISSUE_NUMBER"
            git push origin HEAD:main
          fi
      - name: Fermer la proposition publiée
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue close "$ISSUE_NUMBER" --comment "Proposition validée et ajoutée au catalogue des mini-stages."
